name: Android TV debug APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          test -n "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android TV APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: APK checksum
        run: sha256sum app/build/outputs/apk/debug/*.apk | tee apk-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: LunexTV-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 14
